name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  recipebox-api:
    name: RecipeBox API - test and lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/recipeBoxApi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check code guidelines
        run: npm run lint

  mealplanner-service:
    name: MealPlanner Service - test and lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/mealPlannerService

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check code guidelines
        run: npm run lint

  docker-compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    needs:
      - recipebox-api
      - mealplanner-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config
